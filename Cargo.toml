[workspace]
resolver = "2"
members = ["src-tauri", "installer", "helpers", "src-tauri/src/transfer"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true

[profile.installer]
inherits = "release"
opt-level = "s"

[profile.release.package.peebify-helpers]
opt-level = "s"

[profile.release.package.image]
opt-level = 3

[profile.release.package.png]
opt-level = 3

[profile.release.package.fdeflate]
opt-level = 3

[profile.release.package.zune-jpeg]
opt-level = 3

[profile.release.package.memchr]
opt-level = 3

[profile.release.package.md-5]
opt-level = 3

[profile.release.package.zstd]
opt-level = 3

[profile.release.package.zstd-safe]
opt-level = 3

[profile.release.package.zstd-sys]
opt-level = 3

[profile.release.package.crc32fast]
opt-level = 3

[profile.release.package.flate2]
opt-level = 3

[profile.release.package.miniz_oxide]
opt-level = 3

[profile.release.package.sha2]
opt-level = 3

[profile.release.package.deflate64]
opt-level = 3

[profile.release.package.peebify-transfer]
opt-level = 3

[profile.release.package.crc]
opt-level = 3

[profile.release.package.crc-catalog]
opt-level = 3
