[package]
name = "peebify-launcher"
version = "5.1.1"
description = "Peebify Launcher (Tauri 2, Rust-native backend)"
authors = ["Peebify"]
license = "GPL-3.0-only"
edition = "2021"
publish = false

[lib]
name = "peebify_launcher_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [
    "tray-icon",
    "image-png",
    "wry",
    "protocol-asset"
] }

tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
    "io-util",
    "fs",
    "process",
    "net"
] }
parking_lot = "0.12"
futures = "0.3"
log = "0.4"
chrono = "0.4"
url = "2"
open = { version = "5", features = ["shellexecute-on-windows"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy", "stream", "json", "gzip", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
bytes = "1"
flate2 = "1"
deflate64 = "0.1"
zstd = "0.14"
regex = "1"
uuid = { version = "1", features = ["v4"] }
md-5 = "0.11"
aes = "0.9"
cbc = "0.2"
sha2 = "0.11"
base64 = "0.23"
semver = "1"
hex = "0.4"
p384 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

peebify-helpers = { path = "../helpers", default-features = false }
peebify-transfer = { path = "src/transfer" }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Power",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Pipes",
    "Win32_UI_Shell",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Audio",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
] }
tauri-winrt-notification = "0.8"
winreg = "0.56"

[dev-dependencies]
crc32fast = "1"
