[package]
name = "peebify-installer"
version = "0.1.0"
description = "Peebify Launcher Setup (installer / updater / uninstaller)"
authors = ["Peebify"]
license = "Proprietary"
edition = "2021"
publish = false

[[bin]]
name = "peebify-installer"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "glow"] }
rfd = "0.17"

tar = "0.4"
lzma-rust2 = { version = "0.24", default-features = false, features = ["std", "xz"] }
sha2 = "0.11"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Variant",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
tauri-winres = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
